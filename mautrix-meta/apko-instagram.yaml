contents:
    repositories:
        - https://packages.wolfi.dev/os
    keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
        - wolfi-baselayout
        - bridge-manager
        - mautrix-meta
        # The bridges convert voice messages, videos and GIFs with ffmpeg.
        - ffmpeg

environment:
    # bbctl runs this bridge instead of downloading mautrix's latest build.
    BEEPER_BRIDGE_CUSTOM_STARTUP_COMMAND: /usr/bin/mautrix-instagram
    # The bridge type, for bbctl registering a bridge whose name doesn't say it.
    BEEPER_BRIDGE_TYPE: instagram

entrypoint:
    command: /usr/bin/run-bridge

# The bridge's name on Beeper, when none is given.
cmd: sh-instagram

archs:
    - x86_64
    - aarch64
