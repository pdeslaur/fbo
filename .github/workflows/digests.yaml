name: Digests

# Runs digestabot, which updates each image pinned as <image>:<tag>@<digest>,
# such as melange's and apko's, to the digest its tag now has, and opens a pull
# request with auto-merge enabled, so it merges once the build passes.
#
# The pull request is created with an octo-sts token rather than GITHUB_TOKEN,
# so that it triggers the PR checks. The .github/chainguard/digests.sts.yaml
# trust policy grants it workflows: write, which changing a workflow takes,
# and grants it to this workflow alone.

on:
    schedule:
        - cron: "0 5 * * *"
    workflow_dispatch:

permissions: {}

jobs:
    digests:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write # for octo-sts, and gitsign's commit signatures
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
              id: octo-sts
              with:
                  scope: ${{ github.repository }}
                  identity: digests

            - uses: chainguard-dev/digestabot@3e895adcf935bab7a21ebef6173d7cd4375822ab # v1.3.3
              id: digestabot
              with:
                  token: ${{ steps.octo-sts.outputs.token }}
                  labels-for-pr: ""
                  description-for-pr: |
                      Updates the pinned image digests to the ones their tags now have.

                      Auto-merge is enabled; this will merge once the build checks pass.

            - name: Enable auto-merge
              if: steps.digestabot.outputs.pull_request_number != ''
              env:
                  GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
                  PR_NUMBER: ${{ steps.digestabot.outputs.pull_request_number }}
              run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
