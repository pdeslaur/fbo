name: Build

# Builds the melange package in the caller's melange.yaml for each arch, runs
# its tests, and optionally publishes the apko.yaml image to
# ghcr.io/<caller repository> tagged with "latest" and the package version,
# signed keylessly with cosign.

on:
    workflow_call:
        inputs:
            publish:
                description: Publish the image to GHCR.
                type: boolean
                default: false

permissions: {}

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        # Runs melange from its container image rather than installing it on
        # the runner, which needs apt. --privileged lets melange create the
        # bubblewrap sandboxes it builds and tests in.
        container:
            image: cgr.dev/chainguard/melange:latest-dev@sha256:3ca26400a3e4acc35738abee5c38629395fdb28d534384622729fccfdb346eb2
            options: --privileged
        strategy:
            fail-fast: false
            matrix:
                arch: [x86_64, aarch64]
                include:
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                    - arch: x86_64
                      runner: ubuntu-24.04
        steps:
            # JavaScript actions run with the runner's Node binary mounted into
            # the container, which needs libstdc++. This must come before any
            # of them.
            - name: Install Node dependencies
              run: apk add --no-cache libstdc++

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Scheduled runs skip the cache so that toolchain fixes from
            # Wolfi (e.g. Go or Rust patch releases) are picked up. The key
            # covers every file in the repository, since melange copies them
            # all into the build workspace (e.g. scripts the package installs).
            # The public key is cached alongside the packages it verifies.
            - name: Restore cached packages
              id: cache
              if: github.event_name != 'schedule'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ./packages
                      ./melange-${{ matrix.arch }}.rsa.pub
                  key: packages-${{ matrix.arch }}-${{ hashFiles('**', '!.git/**') }}

            # Each arch is signed with its own key, named after the arch so
            # that apko can tell the keys apart when publishing.
            #
            # --build-date stamps the package with the time of the last commit,
            # as Wolfi does. Without it melange leaves the build date unset, so
            # apko dates the image by its newest Wolfi dependency instead. A
            # fixed date also keeps rebuilds of an unchanged config
            # reproducible. The checkout is owned by the runner user rather
            # than the container's root, so git needs it marked safe.
            - name: Build package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  melange keygen "melange-$ARCH.rsa"
                  melange build melange.yaml \
                    --arch "$ARCH" \
                    --build-date "$(git log -1 --format=%cI)" \
                    --signing-key "melange-$ARCH.rsa" \
                    --source-dir . \
                    --out-dir ./packages

            - name: Test package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  melange test melange.yaml \
                    --arch "$ARCH" \
                    --runner bubblewrap \
                    --repository-append ./packages \
                    --keyring-append "./melange-$ARCH.rsa.pub" \
                    --repository-append https://packages.wolfi.dev/os \
                    --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
                    --test-package-append busybox

            - name: Upload packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages-${{ matrix.arch }}
                  path: |
                      ./packages
                      ./melange-${{ matrix.arch }}.rsa.pub
                  retention-days: 1
                  if-no-files-found: error

    publish:
        if: inputs.publish
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: packages-*
                  merge-multiple: true

            - name: Compute image tags
              id: tags
              env:
                  IMAGE: ghcr.io/${{ github.repository }}
              run: |
                  version=$(yq '.package.version' melange.yaml)
                  echo "tags=$IMAGE:latest $IMAGE:$version" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              id: publish
              uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
              with:
                  config: apko.yaml
                  tag: ${{ steps.tags.outputs.tags }}
                  keyring-append: ./melange-x86_64.rsa.pub,./melange-aarch64.rsa.pub
                  repository-append: ./packages

            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Signs the image index and each per-arch image by digest. The
            # signing identity is this reusable workflow, see README.md.
            - name: Sign image
              env:
                  IMAGE: ${{ steps.publish.outputs.digest }}
              run: cosign sign --yes --recursive "$IMAGE"
