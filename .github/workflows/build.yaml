name: Build

# Builds the melange package of each image directory for each arch, runs its
# tests, and publishes each of its apko*.yaml images to
# ghcr.io/<owner>/<directory><suffix>, tagged with "latest" and the package
# version, signed keylessly with cosign. apko.yaml has no suffix, and
# apko-<suffix>.yaml has "-<suffix>".
#
# Pull requests and pushes build only the images whose directory changed, or
# every image when this workflow changed. Scheduled and manual runs build every
# image.

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up Wolfi package and toolchain fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-26.04
        outputs:
            dirs: ${{ steps.changes.outputs.dirs }}
            images: ${{ steps.changes.outputs.images }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Every directory with a melange.yaml is an image directory.
            - name: List changed images
              id: changes
              env:
                  EVENT: ${{ github.event_name }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_BASE: ${{ github.event.before }}
              run: |
                  case "$EVENT" in
                      pull_request) base=$PR_BASE ;;
                      push) base=$PUSH_BASE ;;
                      *) base= ;;
                  esac

                  dirs=$(ls -d */melange.yaml | xargs -n1 dirname)
                  if [ -n "$base" ]; then
                      changed=$(git diff --name-only "$base" HEAD)
                      if ! echo "$changed" | grep -qx .github/workflows/build.yaml; then
                          dirs=$(echo "$changed" | cut -d/ -f1 | sort -u | grep -Fx "$dirs" || true)
                      fi
                  fi
                  echo "Images: ${dirs:-none}"

                  images=$(for dir in $dirs; do
                      for config in "$dir"/apko*.yaml; do
                          suffix=$(basename "$config" .yaml)
                          jq -cn --arg dir "$dir" --arg config "$config" --arg name "$dir${suffix#apko}" \
                              '{dir: $dir, config: $config, name: $name}'
                      done
                  done | jq -cs .)

                  echo "dirs=$(echo "$dirs" | jq -cnR '[inputs | select(. != "")]')" >> "$GITHUB_OUTPUT"
                  echo "images=$images" >> "$GITHUB_OUTPUT"

    package:
        needs: changes
        if: needs.changes.outputs.dirs != '[]'
        runs-on: ${{ matrix.runner }}
        # Runs melange from its container image rather than installing it on
        # the runner, which needs apt. --privileged lets melange create the
        # bubblewrap sandboxes it builds and tests in.
        container:
            image: cgr.dev/chainguard/melange:latest-dev@sha256:3ca26400a3e4acc35738abee5c38629395fdb28d534384622729fccfdb346eb2
            options: --privileged
        strategy:
            fail-fast: false
            matrix:
                dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
                arch: [x86_64, aarch64]
                include:
                    - arch: aarch64
                      runner: ubuntu-26.04-arm
                    - arch: x86_64
                      runner: ubuntu-26.04
        steps:
            # JavaScript actions run with the runner's Node binary mounted into
            # the container, which needs libstdc++, and actions/cache needs
            # GNU tar rather than the image's BusyBox tar. This must come
            # before any of them.
            - name: Install action dependencies
              run: apk add --no-cache libstdc++ gnutar

            # The full history is for the date of the directory's last commit.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Scheduled runs skip the cache so that toolchain fixes from
            # Wolfi (e.g. Go or Rust patch releases) are picked up. The key
            # covers every file in the directory, since melange copies them
            # all into the build workspace (e.g. scripts the package installs).
            # The public key is cached alongside the packages it verifies.
            - name: Restore cached packages
              id: cache
              if: github.event_name != 'schedule'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ./packages
                      ./melange-${{ matrix.arch }}.rsa.pub
                  key: packages-${{ matrix.dir }}-${{ matrix.arch }}-${{ hashFiles(format('{0}/**', matrix.dir)) }}

            # Each arch is signed with its own key, named after the arch so
            # that apko can tell the keys apart when publishing.
            #
            # --build-date stamps the package with the time of the directory's
            # last commit, as Wolfi does. Without it melange leaves the build
            # date unset, so apko dates the image by its newest Wolfi
            # dependency instead. A fixed date also keeps rebuilds of an
            # unchanged config reproducible. The checkout is owned by the
            # runner user rather than the container's root, so git needs it
            # marked safe.
            - name: Build package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
                  DIR: ${{ matrix.dir }}
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  melange keygen "melange-$ARCH.rsa"
                  melange build "$DIR/melange.yaml" \
                    --arch "$ARCH" \
                    --build-date "$(git log -1 --format=%cI -- "$DIR")" \
                    --signing-key "melange-$ARCH.rsa" \
                    --source-dir "$DIR" \
                    --out-dir ./packages

            - name: Test package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
                  DIR: ${{ matrix.dir }}
              run: |
                  melange test "$DIR/melange.yaml" \
                    --arch "$ARCH" \
                    --runner bubblewrap \
                    --repository-append ./packages \
                    --keyring-append "./melange-$ARCH.rsa.pub" \
                    --repository-append https://packages.wolfi.dev/os \
                    --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
                    --test-package-append busybox

            - name: Upload packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages-${{ matrix.dir }}-${{ matrix.arch }}
                  path: |
                      ./packages
                      ./melange-${{ matrix.arch }}.rsa.pub
                  retention-days: 1
                  if-no-files-found: error

    # Runs even when some packages failed, so that one broken image doesn't
    # hold back the others: an image whose packages are missing fails to
    # download them.
    publish:
        needs: [changes, package]
        if: >-
            !cancelled()
            && github.event_name != 'pull_request'
            && needs.changes.result == 'success'
            && needs.changes.outputs.images != '[]'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: ${{ fromJSON(needs.changes.outputs.images) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download x86_64 packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages-${{ matrix.image.dir }}-x86_64

            - name: Download aarch64 packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages-${{ matrix.image.dir }}-aarch64

            - name: Compute image tags
              id: tags
              env:
                  DIR: ${{ matrix.image.dir }}
                  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
              run: |
                  version=$(yq '.package.version' "$DIR/melange.yaml")
                  echo "tags=$IMAGE:latest $IMAGE:$version" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              id: publish
              uses: chainguard-images/actions/apko-publish@f3fe6194c29f66abe278166e718bb3ef20754a71 # v1.0.39
              with:
                  config: ${{ matrix.image.config }}
                  tag: ${{ steps.tags.outputs.tags }}
                  keyring-append: ./melange-x86_64.rsa.pub,./melange-aarch64.rsa.pub
                  repository-append: ./packages

            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Signs the image index and each per-arch image by digest.
            - name: Sign image
              env:
                  IMAGE: ${{ steps.publish.outputs.digest }}
              run: cosign sign --yes --recursive "$IMAGE"

    # The check to require: the package and publish jobs depend on which
    # images changed, and may not run at all.
    build:
        needs: [changes, package, publish]
        if: always()
        runs-on: ubuntu-26.04
        steps:
            - env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  for result in $RESULTS; do
                      case "$result" in
                          success | skipped) ;;
                          *) echo "A job's result is $result"; exit 1 ;;
                      esac
                  done
