name: Build

# Builds the melange package of each image directory for each arch, runs its
# tests, signs the packages with the KMS key whose public half is
# apk.philde.net.rsa.pub, adds them to the apk repository at
# https://apk.philde.net/os, and publishes each of its apko*.yaml images, built
# from that repository, to ghcr.io/<owner>/<directory><suffix>, tagged with
# "latest" and the package version, signed keylessly with cosign. apko.yaml has
# no suffix, and apko-<suffix>.yaml has "-<suffix>".
#
# Pull requests and pushes build only the images whose directory changed, or
# every image when this workflow changed. Scheduled and manual runs build every
# image, picking up Wolfi's fixes to what they install. A package is built on
# main only when the repository doesn't have its version-epoch, which never
# changes once it does.

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up Wolfi package and toolchain fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    # The KMS key packages and indexes are signed with, whose public half is
    # apk.philde.net.rsa.pub.
    KMS_KEY_VERSION: projects/philde-net/locations/us-west1/keyRings/apk/cryptoKeys/apk-signing/cryptoKeyVersions/1
    # cloudflare-sts, and its profile for the apk repository's bucket, served
    # at REPOSITORY.
    BROKER_URL: https://cloudflare-sts.philde.net
    BROKER_SCOPE: pdeslaur/fbo:apk
    REPOSITORY: https://apk.philde.net/os

jobs:
    changes:
        runs-on: ubuntu-26.04
        outputs:
            dirs: ${{ steps.changes.outputs.dirs }}
            images: ${{ steps.changes.outputs.images }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Every directory with a melange.yaml is an image directory.
            #
            # A version-epoch in the repository is immutable, so on main a
            # package is built only when the repository doesn't have it. Pull
            # requests build what they change, to test it, and fail if they
            # change a package's inputs (anything in its directory but READMEs
            # and image configs) without a version-epoch the repository
            # doesn't have: the change would never ship.
            - name: List changed images and packages to build
              id: changes
              env:
                  EVENT: ${{ github.event_name }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_BASE: ${{ github.event.before }}
              run: |
                  case "$EVENT" in
                      pull_request) base=$PR_BASE ;;
                      push) base=$PUSH_BASE ;;
                      *) base= ;;
                  esac

                  dirs=$(ls -d */melange.yaml | xargs -n1 dirname)
                  if [ -n "$base" ]; then
                      changed=$(git diff --name-only "$base" HEAD)
                      if ! echo "$changed" | grep -qx .github/workflows/build.yaml; then
                          dirs=$(echo "$changed" | cut -d/ -f1 | sort -u | grep -Fx "$dirs" || true)
                      fi
                  fi
                  echo "Images: ${dirs:-none}"

                  # The packages each arch's index lists, as <name>-<version>.apk.
                  # A repository without an index yet has none.
                  indexes=$(mktemp -d)
                  for arch in x86_64 aarch64; do
                      if curl -fsS -o "$indexes/APKINDEX.tar.gz" "$REPOSITORY/$arch/APKINDEX.tar.gz"; then
                          tar -xzOf "$indexes/APKINDEX.tar.gz" APKINDEX |
                              awk -F: '/^P:/ { name = $2 } /^V:/ { print name "-" $2 ".apk" }' >"$indexes/$arch"
                      else
                          : >"$indexes/$arch"
                      fi
                  done

                  build=
                  stale=
                  for dir in $dirs; do
                      file=$(yq '.package | .name + "-" + .version + "-r" + (.epoch | tostring) + ".apk"' "$dir/melange.yaml")
                      published=true
                      for arch in x86_64 aarch64; do
                          grep -qxF "$file" "$indexes/$arch" || published=false
                      done
                      if [ "$EVENT" = pull_request ]; then
                          build="$build $dir"
                          if $published && [ -n "$(git diff --name-only "$base" HEAD -- "$dir" ':!*.md' ':!*/apko*.yaml')" ]; then
                              echo "::error file=$dir/melange.yaml::The repository already has $file: bump package.epoch to change it."
                              stale=1
                          fi
                      elif ! $published; then
                          build="$build $dir"
                      fi
                  done
                  echo "Packages to build:${build:- none}"

                  images=$(for dir in $dirs; do
                      for config in "$dir"/apko*.yaml; do
                          suffix=$(basename "$config" .yaml)
                          jq -cn --arg dir "$dir" --arg config "$config" --arg name "$dir${suffix#apko}" \
                              '{dir: $dir, config: $config, name: $name}'
                      done
                  done | jq -cs .)

                  echo "dirs=$(echo "$build" | tr ' ' '\n' | jq -cnR '[inputs | select(. != "")]')" >> "$GITHUB_OUTPUT"
                  echo "images=$images" >> "$GITHUB_OUTPUT"
                  [ -z "$stale" ]

    package:
        needs: changes
        if: needs.changes.outputs.dirs != '[]'
        runs-on: ${{ matrix.runner }}
        # Runs melange from its container image rather than installing it on
        # the runner, which needs apt. --privileged lets melange create the
        # bubblewrap sandboxes it builds and tests in.
        container:
            image: cgr.dev/chainguard/melange:latest-dev@sha256:bce150e5c4ef8a2954fe7b2315d82c5e138b11414a0071e954e13eab90a94c1d
            options: --privileged
        strategy:
            fail-fast: false
            matrix:
                dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
                arch: [x86_64, aarch64]
                include:
                    - arch: aarch64
                      runner: ubuntu-26.04-arm
                    - arch: x86_64
                      runner: ubuntu-26.04
        steps:
            # JavaScript actions run with the runner's Node binary mounted into
            # the container, which needs libstdc++, and actions/cache needs
            # GNU tar rather than the image's BusyBox tar. This must come
            # before any of them.
            - name: Install action dependencies
              run: apk add --no-cache libstdc++ gnutar

            # The full history is for the date of the directory's last commit.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Pull requests cache their packages between pushes. Main builds
            # only what the repository doesn't have, from scratch. The key
            # covers every file in the directory, since melange copies them
            # all into the build workspace (e.g. scripts the package installs).
            # The public key is cached alongside the packages it verifies.
            - name: Restore cached packages
              id: cache
              if: github.event_name == 'pull_request'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ./packages
                      ./melange-${{ matrix.arch }}.rsa.pub
                  key: packages-${{ matrix.dir }}-${{ matrix.arch }}-${{ hashFiles(format('{0}/**', matrix.dir)) }}

            # Each arch is signed with its own key, named after the arch so
            # that apko can tell the keys apart when publishing.
            #
            # --build-date stamps the package with the time of the directory's
            # last commit, as Wolfi does. Without it melange leaves the build
            # date unset, so apko dates the image by its newest Wolfi
            # dependency instead. A fixed date also keeps rebuilds of an
            # unchanged config reproducible. The checkout is owned by the
            # runner user rather than the container's root, so git needs it
            # marked safe.
            - name: Build package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
                  DIR: ${{ matrix.dir }}
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  melange keygen "melange-$ARCH.rsa"
                  melange build "$DIR/melange.yaml" \
                    --arch "$ARCH" \
                    --build-date "$(git log -1 --format=%cI -- "$DIR")" \
                    --signing-key "melange-$ARCH.rsa" \
                    --source-dir "$DIR" \
                    --out-dir ./packages

            - name: Test package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
                  DIR: ${{ matrix.dir }}
              run: |
                  melange test "$DIR/melange.yaml" \
                    --arch "$ARCH" \
                    --runner bubblewrap \
                    --repository-append ./packages \
                    --keyring-append "./melange-$ARCH.rsa.pub" \
                    --repository-append https://packages.wolfi.dev/os \
                    --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
                    --test-package-append busybox

            - name: Upload packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages-${{ matrix.dir }}-${{ matrix.arch }}
                  path: |
                      ./packages
                      ./melange-${{ matrix.arch }}.rsa.pub
                  retention-days: 1
                  if-no-files-found: error

    # Replaces the throwaway signatures of a directory's packages, for both
    # arches, with ones by the apk/apk-signing KMS key in philde-net, and adds
    # them to the apk repository. Only this workflow on main may sign with the
    # key, through the GitHub workload identity pool, or write the repository,
    # through cloudflare-sts, so pull requests keep the throwaway signatures and
    # publish nothing. Runs even when some packages failed, like publish.
    sign:
        needs: [changes, package]
        if: >-
            !cancelled()
            && github.event_name != 'pull_request'
            && needs.changes.result == 'success'
            && needs.changes.outputs.dirs != '[]'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write # for the KMS key, through workload identity federation
        strategy:
            fail-fast: false
            matrix:
                dir: ${{ fromJSON(needs.changes.outputs.dirs) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.sum

            - name: Download x86_64 packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages-${{ matrix.dir }}-x86_64

            - name: Download aarch64 packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages-${{ matrix.dir }}-aarch64

            - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: projects/455982902327/locations/global/workloadIdentityPools/github/providers/actions

            - name: Build tools
              run: go build -C tools -o "$RUNNER_TEMP/" ./cmd/apk-sign ./cmd/apk-repo

            - name: Sign packages
              env:
                  PUBLIC_KEY: apk.philde.net.rsa.pub
              run: '"$RUNNER_TEMP/apk-sign" packages/*/*.apk'

            # A version-epoch the repository already has is kept, not
            # replaced.
            - name: Add packages to the repository
              run: '"$RUNNER_TEMP/apk-repo" upload packages/*/*.apk'

    # Lists the packages the sign jobs added in each arch's APKINDEX, and signs
    # it. Runs once, after every sign job, so the index has one writer; runs
    # on main never overlap.
    index:
        needs: [changes, sign]
        if: >-
            !cancelled()
            && github.event_name != 'pull_request'
            && needs.changes.result == 'success'
            && needs.changes.outputs.dirs != '[]'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write # for the KMS key and the repository's bucket
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.sum

            - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: projects/455982902327/locations/global/workloadIdentityPools/github/providers/actions

            - name: Build tools
              run: go build -C tools -o "$RUNNER_TEMP/" ./cmd/apk-repo

            - name: Index the repository
              env:
                  PUBLIC_KEY: apk.philde.net.rsa.pub
              run: '"$RUNNER_TEMP/apk-repo" index'

    # Runs even when some packages failed, so that one broken image doesn't
    # hold back the others: an image whose version-epoch isn't in the
    # repository fails.
    publish:
        needs: [changes, index]
        if: >-
            !cancelled()
            && github.event_name != 'pull_request'
            && needs.changes.result == 'success'
            && contains(fromJSON('["success", "skipped"]'), needs.index.result)
            && needs.changes.outputs.images != '[]'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: ${{ fromJSON(needs.changes.outputs.images) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # apk installs the latest version the repository has, which is the
            # previous version-epoch's if this one's build failed: the image
            # would be tagged with a version it doesn't have.
            - name: Check the packages and compute image tags
              id: tags
              env:
                  DIR: ${{ matrix.image.dir }}
                  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
              run: |
                  name=$(yq '.package.name' "$DIR/melange.yaml")
                  version=$(yq '.package.version' "$DIR/melange.yaml")
                  epoch=$(yq '.package.epoch' "$DIR/melange.yaml")
                  for arch in x86_64 aarch64; do
                      url="$REPOSITORY/$arch/$name-$version-r$epoch.apk"
                      if ! curl -fsSI -o /dev/null "$url"; then
                          echo "::error::The repository doesn't have $url: its build or signing failed."
                          exit 1
                      fi
                  done
                  echo "tags=$IMAGE:latest $IMAGE:$version" >> "$GITHUB_OUTPUT"

            # For cosign, which pushes the signatures next to the image.
            - name: Login to GHCR
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Runs Chainguard's apko image, pinned by digest like melange's,
            # rather than the wolfi-dev/sdk image the apko-publish action runs
            # apko in, which takes longer to pull than the image takes to
            # build. apko pushes to ghcr.io with GITHUB_TOKEN, and writes the
            # per-arch images' references, then the index's, to image-refs.
            # --vcs=false leaves the commit out of the index's annotations, so
            # that an image rebuilt from the same packages keeps its digest.
            - name: Build and publish image
              uses: docker://cgr.dev/chainguard/apko:latest@sha256:a45c1de9c78bebe85b9735395bdf8e955d41a6863117bab404a766f135fcb313
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  args: >-
                      publish
                      --vcs=false
                      --image-refs image-refs
                      --keyring-append ./apk.philde.net.rsa.pub
                      --repository-append ${{ env.REPOSITORY }}
                      -- ${{ matrix.image.config }} ${{ steps.tags.outputs.tags }}

            - name: Read the image's digest
              id: publish
              run: echo "digest=$(tail -n 1 image-refs)" >> "$GITHUB_OUTPUT"

            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Signs the image index and each per-arch image by digest, in
            # parallel, unless this workflow already has. Images are built
            # reproducibly from the repository's immutable packages, so a
            # rebuild with nothing new from Wolfi is the digest already signed.
            #
            # Each cosign gets its own TUF cache in TUF_ROOT: concurrent
            # cosigns sharing ~/.sigstore race to write its metadata, and one
            # fails with "failed to persist metadata".
            - name: Sign image
              env:
                  IMAGE: ${{ steps.publish.outputs.digest }}
                  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yaml@${{ github.ref }}
              run: |
                  if cosign verify "$IMAGE" \
                          --certificate-identity "$IDENTITY" \
                          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                          >/dev/null 2>&1; then
                      echo "Already signed: $IMAGE"
                  else
                      xargs -P 0 -I {} sh -c 'TUF_ROOT=$(mktemp -d) cosign sign --yes "$1"' _ {} <image-refs
                  fi

    # The check to require: the package, sign, index and publish jobs depend on
    # which images changed, and may not run at all.
    build:
        needs: [changes, package, sign, index, publish]
        if: always()
        runs-on: ubuntu-26.04
        steps:
            - env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  for result in $RESULTS; do
                      case "$result" in
                          success | skipped) ;;
                          *) echo "A job's result is $result"; exit 1 ;;
                      esac
                  done
