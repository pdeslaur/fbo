name: Update

# Runs melange-update on each image directory's melange.yaml, bumping it and
# the Go modules it pins with "go get" to their latest releases, and opens a
# pull request per package with auto-merge enabled. While a package's pull
# request is open, later runs update it in place.
#
# The pull requests are created with an octo-sts token rather than
# GITHUB_TOKEN so that they trigger the PR checks. The
# .github/chainguard/update.sts.yaml trust policy grants it contents: write and
# pull_requests: write.

on:
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions: {}

jobs:
    packages:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        outputs:
            dirs: ${{ steps.list.outputs.dirs }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: List image directories
              id: list
              run: echo "dirs=$(ls -d */melange.yaml | xargs -n1 dirname | jq -cnR '[inputs]')" >> "$GITHUB_OUTPUT"

    update:
        needs: packages
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write # for octo-sts
        strategy:
            fail-fast: false
            matrix:
                dir: ${{ fromJSON(needs.packages.outputs.dirs) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.sum

            - name: Check for update and patch melange.yaml
              id: update
              env:
                  GH_TOKEN: ${{ github.token }}
                  MELANGE_CONFIG: ${{ github.workspace }}/${{ matrix.dir }}/melange.yaml
              working-directory: tools
              run: go run ./cmd/melange-update

            - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
              if: steps.update.outputs.updated == 'true'
              id: octo-sts
              with:
                  scope: ${{ github.repository }}
                  identity: update

            - name: Create pull request
              if: steps.update.outputs.updated == 'true'
              id: pr
              uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  token: ${{ steps.octo-sts.outputs.token }}
                  add-paths: ${{ matrix.dir }}/melange.yaml
                  branch: update/${{ steps.update.outputs.package }}
                  delete-branch: true
                  title: ${{ steps.update.outputs.title }}
                  commit-message: "${{ matrix.dir }}: ${{ steps.update.outputs.title }}"
                  body: |
                      ${{ steps.update.outputs.body }}
                      Auto-merge is enabled; this will merge once the build checks pass.

            - name: Enable auto-merge
              if: steps.pr.outputs.pull-request-number != ''
              env:
                  GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
                  PR_URL: ${{ steps.pr.outputs.pull-request-url }}
              run: gh pr merge --auto --squash "$PR_URL"
