name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-26.04
        defaults:
            run:
                working-directory: tools
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.sum

            - name: gofmt
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "${unformatted}" ]; then
                      echo "Not formatted with gofmt:"
                      echo "${unformatted}"
                      exit 1
                  fi

            - run: go mod tidy -diff

            - run: go vet ./...

            - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

            - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    test:
        runs-on: ubuntu-26.04
        defaults:
            run:
                working-directory: tools
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.sum

            - run: go test -race ./...
