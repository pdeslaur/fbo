package:
    name: mautrix-linkedin
    version: "0.2611.0"
    epoch: 0
    description: A Matrix-LinkedIn puppeting bridge
    copyright:
        - license: AGPL-3.0-or-later

environment:
    contents:
        repositories:
            - https://packages.wolfi.dev/os
        keyring:
            - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        packages:
            - build-base
            - busybox
            - ca-certificates-bundle
            - git
            - go-1.27=1.27.4-r0

pipeline:
    - uses: git-checkout
      with:
          repository: https://github.com/mautrix/linkedin
          tag: v${{package.version}}
          expected-commit: c79135a23c50358d3b4547c2ae4712099ea0158a

    # As the bridge's build.sh does: maubuild stamps the version from git, and
    # goolm is the pure-Go Olm, so there's no libolm. cgo links go-sqlite3.
    - name: Build
      runs: |
          BINARY_NAME=mautrix-linkedin go tool maubuild -tags goolm -o "${{targets.destdir}}/usr/bin/mautrix-linkedin"

test:
    pipeline:
        - runs: mautrix-linkedin --version
