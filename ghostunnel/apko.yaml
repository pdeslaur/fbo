contents:
    repositories:
        - https://packages.wolfi.dev/os
    keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
        - wolfi-baselayout
        - ca-certificates-bundle
        - ghostunnel

accounts:
    run-as: 65532
    users:
        - username: nonroot
          uid: 65532
    groups:
        - groupname: nonroot
          gid: 65532

entrypoint:
    command: /usr/bin/ghostunnel

archs:
    - x86_64
    - aarch64
