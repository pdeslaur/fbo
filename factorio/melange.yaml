package:
    name: factorio
    version: "2.1.25"
    epoch: 0
    description: Factorio headless server
    copyright:
        - license: PROPRIETARY
    dependencies:
        runtime:
            # The start script runs under /bin/sh.
            - busybox

environment:
    contents:
        repositories:
            - https://packages.wolfi.dev/os
        keyring:
            - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        packages:
            - busybox
            - gnutar
            - xz

vars:
    # Read by melange-update to find new releases.
    update-url: https://factorio.com/api/latest-releases
    update-version: .stable.headless
    update-release-notes: '"https://factorio.com/download/archive/" + $version'

pipeline:
    - runs: mkdir -p "${{targets.destdir}}/factorio"

    - uses: fetch
      if: ${{build.arch}} == 'x86_64'
      with:
          uri: https://factorio.com/get-download/${{package.version}}/headless/linux64
          expected-sha256: 78da2f5aa99e9e0af7586d6bf82c04aae91165d53036720dabb26e855688f3ae
          directory: ${{targets.destdir}}/factorio
          delete: true

    - uses: fetch
      if: ${{build.arch}} == 'aarch64'
      with:
          uri: https://factorio.com/get-download/${{package.version}}/headless/linux-arm64
          expected-sha256: c10ab4008043713b6e37097850c69ff675acac7ab965e87d768ce46d0c1753fd
          directory: ${{targets.destdir}}/factorio
          delete: true

    - runs: install -Dm755 start "${{targets.destdir}}/usr/bin/factorio-start"

test:
    pipeline:
        - runs: /factorio/bin/*/factorio --version
