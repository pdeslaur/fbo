contents:
    repositories:
        - https://packages.wolfi.dev/os
    keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
        - wolfi-baselayout
        - factorio

# Saves, server settings and mods are expected to be mounted at
# /factorio/saves, /factorio/config and /factorio/mods. The server listens on
# 34197/udp.
work-dir: /factorio

environment:
    SAVE_FILE: /factorio/saves/save.zip
    CONFIG_FILE: /factorio/config/server-settings.json

entrypoint:
    command: /usr/bin/factorio-start

archs:
    - x86_64
    - aarch64
