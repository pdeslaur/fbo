contents:
    repositories:
        - https://packages.wolfi.dev/os
    keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
        - wolfi-baselayout
        - minecraft-server

# World data is expected to be mounted at /data. The server listens on
# 25565/tcp.
work-dir: /data

entrypoint:
    command: /usr/bin/java -jar /usr/share/minecraft/server.jar nogui

archs:
    - x86_64
    - aarch64
