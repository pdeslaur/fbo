package:
    # Not "caddy", which Wolfi also has: apk installs the highest version
    # across repositories, so a newer Wolfi caddy, without these plugins,
    # would replace this one in the image.
    name: caddy-sso
    version: "2.11.9"
    epoch: 6
    description: Caddy web server with the cloudflare-sts DNS provider and Pocket ID single sign-on
    copyright:
        - license: Apache-2.0
    dependencies:
        runtime:
            - ca-certificates-bundle

environment:
    contents:
        repositories:
            - https://packages.wolfi.dev/os
        keyring:
            - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        packages:
            - busybox
            - ca-certificates-bundle
            - go-1.27=1.27.4-r0
    environment:
        CGO_ENABLED: "0"

pipeline:
    - uses: git-checkout
      with:
          repository: https://github.com/caddyserver/caddy
          tag: v${{package.version}}
          expected-commit: 0d98caea58f794f88e709b1bef2880996a471bca

    - name: Add the cloudflare-sts DNS provider and the pocketid auth plugin
      runs: |
          {
            echo 'package main'
            echo ''
            echo 'import ('
            echo '	_ "time/tzdata"'
            echo ''
            echo '	caddycmd "github.com/caddyserver/caddy/v2/cmd"'
            echo '	_ "github.com/caddyserver/caddy/v2/modules/standard"'
            echo '	_ "github.com/pdeslaur/caddy-pocketid"'
            echo '	_ "github.com/pdeslaur/cloudflare-sts/go/caddydns"'
            echo ')'
            echo ''
            echo 'func main() { caddycmd.Main() }'
          } > cmd/caddy/main.go
          go get github.com/pdeslaur/caddy-pocketid@v0.4.0
          go get github.com/pdeslaur/cloudflare-sts@v0.27.0
          go mod tidy

    - uses: go/build
      with:
          packages: ./cmd/caddy
          output: caddy
          go-package: go-1.27
          tags: nobadger,nomysql,nopgx

test:
    pipeline:
        - runs: /usr/bin/caddy version
