contents:
    repositories:
        - https://packages.wolfi.dev/os
    keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
        - wolfi-baselayout
        - ca-certificates-bundle
        - bash
        - nodejs-26
        - openssl
        - spliit

entrypoint:
    command: /bin/bash /usr/lib/spliit/entrypoint.sh

environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    HOSTNAME: "0.0.0.0"
    PORT: "3000"

archs:
    - x86_64
    - aarch64
