contents:
    repositories:
        - https://packages.wolfi.dev/os
    keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
        - wolfi-baselayout
        - ca-certificates-bundle
        - bash
        - bun
        - spliit-migrate

entrypoint:
    command: /bin/bash /usr/lib/spliit-cloud/migrate/entrypoint.sh

environment:
    NODE_ENV: production

archs:
    - x86_64
    - aarch64
