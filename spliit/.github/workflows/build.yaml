name: Build

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up Wolfi package and toolchain fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    id-token: write # for keyless signing with cosign
    packages: write

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                arch: [x86_64, aarch64]
                include:
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                    - arch: x86_64
                      runner: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Scheduled runs skip the cache so that toolchain fixes from
            # Wolfi (e.g. Bun patch releases) are picked up.
            - name: Restore cached packages
              id: cache
              if: github.event_name != 'schedule'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ./packages
                  key: melange-${{ matrix.arch }}-${{ hashFiles('melange.yaml') }}

            - uses: chainguard-dev/actions/setup-melange@794a2c44abbbd7b3a186db97b359270e4105448f # v1.8.0
              if: steps.cache.outputs.cache-hit != 'true'

            - name: Build package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  melange keygen melange.rsa
                  sudo melange build melange.yaml \
                    --arch "$ARCH" \
                    --build-date "$(git log -1 --format=%cI)" \
                    --signing-key melange.rsa \
                    --source-dir . \
                    --out-dir ./packages
                  sudo chown -R runner:runner ./packages

            - name: Test package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  melange test melange.yaml \
                    --arch "$ARCH" \
                    --runner bubblewrap \
                    --repository-append ./packages \
                    --keyring-append ./melange.rsa.pub \
                    --repository-append https://packages.wolfi.dev/os \
                    --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
                    --test-package-append busybox

            - name: Upload packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages-${{ matrix.arch }}
                  path: ./packages
                  retention-days: 1
                  if-no-files-found: error

    publish:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image:
                    - {apko: apko.yaml, suffix: ""}
                    - {apko: apko-api.yaml, suffix: "-api"}
                    - {apko: apko-worker.yaml, suffix: "-worker"}
                    - {apko: apko-migrate.yaml, suffix: "-migrate"}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: chainguard-dev/actions/setup-melange@794a2c44abbbd7b3a186db97b359270e4105448f # v1.8.0

            - name: Download packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: packages-*
                  path: ./packages
                  merge-multiple: true

            - name: Re-index packages under a single key
              run: |
                  melange keygen melange.rsa
                  for arch in x86_64 aarch64; do
                    melange sign -k melange.rsa packages/$arch/*.apk
                    melange index -o packages/$arch/APKINDEX.tar.gz packages/$arch/*.apk
                    melange sign-index --signing-key melange.rsa packages/$arch/APKINDEX.tar.gz
                  done

            - name: Compute image tags
              id: tags
              env:
                  SUFFIX: ${{ matrix.image.suffix }}
              run: |
                  version=$(yq '.package.version' melange.yaml)
                  image="ghcr.io/${{ github.repository_owner }}/oci-spliit${SUFFIX}"
                  echo "tags=${image}:latest ${image}:${version}" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              id: publish
              uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
              with:
                  config: ${{ matrix.image.apko }}
                  tag: ${{ steps.tags.outputs.tags }}
                  keyring-append: ./melange.rsa.pub
                  repository-append: ./packages

            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Signs the image index and each per-arch image by digest.
            - name: Sign image
              env:
                  IMAGE: ${{ steps.publish.outputs.digest }}
              run: cosign sign --yes --recursive "$IMAGE"
