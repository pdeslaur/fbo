package:
    name: spliit
    version: "2.10.2"
    epoch: 1
    description: Spliit Cloud web static files and Caddy proxy config
    copyright:
        - license: MIT
    dependencies:
        runtime:
            - caddy

subpackages:
    - name: spliit-api
      description: Spliit Cloud API server
      dependencies:
          runtime:
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Move API files
            runs: |
                mkdir -p "${{targets.contextdir}}/usr/lib/spliit-cloud"
                mv "${{targets.destdir}}/usr/lib/spliit-cloud/api" \
                   "${{targets.contextdir}}/usr/lib/spliit-cloud/"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/api/dist/server.js

    - name: spliit-worker
      description: Spliit Cloud background worker
      dependencies:
          runtime:
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Move worker files
            runs: |
                mkdir -p "${{targets.contextdir}}/usr/lib/spliit-cloud"
                mv "${{targets.destdir}}/usr/lib/spliit-cloud/worker" \
                   "${{targets.contextdir}}/usr/lib/spliit-cloud/"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/worker/server.js

    - name: spliit-migrate
      description: Spliit Cloud database migration runner
      dependencies:
          runtime:
              - bash
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Move migrate files
            runs: |
                mkdir -p "${{targets.contextdir}}/usr/lib/spliit-cloud"
                mv "${{targets.destdir}}/usr/lib/spliit-cloud/migrate" \
                   "${{targets.contextdir}}/usr/lib/spliit-cloud/"
      test:
          pipeline:
              - runs: |
                    cd /usr/lib/spliit-cloud/migrate
                    DATABASE_URL=postgresql://x:x@localhost/x \
                        bun node_modules/prisma/build/index.js validate --config prisma.config.ts

environment:
    contents:
        repositories:
            - https://packages.wolfi.dev/os
        keyring:
            - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        packages:
            - busybox
            - ca-certificates-bundle
            - bun=1.4.5-r0
    environment:
        # Baked into the web SPA at build time; the API reads
        # PUBLIC_DEFAULT_CURRENCY_CODE at runtime independently.
        VITE_DEFAULT_CURRENCY_CODE: "USD"
        # Mock DATABASE_URL so Prisma can resolve the datasource URL during
        # client generation without hitting an actual database.
        DATABASE_URL: "postgresql://postgres:1234@localhost/spliit"

pipeline:
    - uses: git-checkout
      with:
          repository: https://github.com/antonio-ivanovski/spliit-cloud
          tag: v${{package.version}}
          expected-commit: 2f729fd5fbcc84c2edf051faafcfd024d254c732

    - name: Patch API bind address
      runs: |
          # Upstream hardcodes hostname: '0.0.0.0'. Patch it to read BIND_HOST
          # so operators can restrict the listening address (e.g. to a loopback
          # or specific interface) without forking the project.
          sed -i "s/hostname: '0.0.0.0'/hostname: process.env.BIND_HOST ?? '0.0.0.0'/" \
              apps/api/src/server.ts

    - name: Install dependencies
      runs: |
          bun install --frozen-lockfile

    - name: Generate Prisma client
      runs: |
          bun run --filter @spliit/db prisma-generate

    - name: Build web
      runs: |
          bun run --filter @spliit/web build
          # A browser SPA has no native dependencies. Some bundlers trace
          # optional native deps (e.g. musl Sharp variants) into the output
          # directory. Remove any ELF binaries to prevent melange from
          # auto-detecting a musl or glibc runtime dep in the web package.
          find apps/web/dist -type f -exec sh -c '
              if file "$1" | grep -q ELF; then
                  echo "Removing ELF binary from web dist: $1"
                  rm "$1"
              fi
          ' _ {} \;

    - name: Bundle API
      runs: |
          cd apps/api
          bun run bundle:runtime
          cd ../..
          # Remove musl-linked native addons; Wolfi uses glibc, keep only gnu variants.
          find apps/api/dist -name "*musl*.node" -delete

    - name: Bundle worker
      runs: |
          cd apps/worker
          bun run bundle:runtime
          cd ../..

    - name: Install prisma CLI for runtime migrations
      runs: |
          PRISMA_VERSION=$(bun -e "const p=require('./packages/db/package.json');console.log(p.devDependencies.prisma.replace(/^[^0-9]*/,''))")
          mkdir -p /tmp/prisma-runtime
          cd /tmp/prisma-runtime
          bun init -y > /dev/null 2>&1
          bun add "prisma@${PRISMA_VERSION}"

    - name: Install web files
      runs: |
          DEST="${{targets.destdir}}/usr/share/spliit"
          mkdir -p "$DEST"
          cp -r apps/web/dist/. "$DEST/"
          cat > "$DEST/Caddyfile" << 'EOF'
          :80 {
              root * /usr/share/spliit

              @api {
                  path /trpc/*
                  path /auth/*
                  path /.well-known/*
                  path /health
                  path /health/*
                  path /expenses/*/documents/*
                  path /expenses/*/pdf
                  path /groups/*/balance/pdf
                  path /openapi.json
                  path /docs
                  path /docs/*
              }

              reverse_proxy @api api:3001 {
                  # Strip any client-supplied IP headers before setting our own,
                  # so TRUST_PROXY in the API only trusts what Caddy actually set.
                  header_up -X-Forwarded-For
                  header_up -X-Real-IP
                  header_up X-Real-IP {remote_host}
              }

              @hashedAssets path /assets/*
              header @hashedAssets Cache-Control "public, max-age=31536000, immutable"

              try_files {path} /index.html
              file_server
          }
          EOF

    - name: Install API files
      runs: |
          DEST="${{targets.destdir}}/usr/lib/spliit-cloud/api"
          mkdir -p "$DEST/dist" "$DEST/fonts" "$DEST/assets"
          cp -r apps/api/dist/. "$DEST/dist/"
          cp -r apps/api/src/lib/og/fonts/. "$DEST/fonts/"
          cp -r apps/api/src/lib/og/assets/. "$DEST/assets/"

    - name: Install worker files
      runs: |
          DEST="${{targets.destdir}}/usr/lib/spliit-cloud/worker"
          mkdir -p "$DEST"
          cp apps/worker/dist/server.js "$DEST/"

    - name: Install migrate files
      runs: |
          DEST="${{targets.destdir}}/usr/lib/spliit-cloud/migrate"
          mkdir -p "$DEST"
          cp -r packages/db/prisma "$DEST/"
          # Copy the full node_modules tree so prisma's own deps (effect, c12,
          # etc.) are present alongside prisma/ and @prisma/.
          cp -r /tmp/prisma-runtime/node_modules "$DEST/"
          # Prisma 7 reads datasource URL from its config file, not the schema.
          # Upstream's config loads dotenv; this minimal version skips that.
          cat > "$DEST/prisma.config.ts" << 'EOF'
          import { defineConfig, env } from 'prisma/config'

          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: 'prisma/migrations' },
            datasource: { url: env('DATABASE_URL') },
          })
          EOF
          cat > "$DEST/entrypoint.sh" << 'EOF'
          #!/bin/bash
          set -euo pipefail
          cd /usr/lib/spliit-cloud/migrate
          exec bun node_modules/prisma/build/index.js migrate deploy \
              --config prisma.config.ts
          EOF
          chmod +x "$DEST/entrypoint.sh"

test:
    pipeline:
        - runs: |
              test -f /usr/share/spliit/index.html
              test -f /usr/share/spliit/Caddyfile
