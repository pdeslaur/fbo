package:
    name: spliit
    version: "2.10.2"
    epoch: 0
    description: Spliit Cloud web static files and nginx proxy config
    copyright:
        - license: MIT
    dependencies:
        runtime:
            - caddy

subpackages:
    - name: spliit-api
      description: Spliit Cloud API server
      dependencies:
          runtime:
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Install API
            runs: |
                DEST="${{targets.destdir}}/usr/lib/spliit-cloud/api"
                mkdir -p "$DEST/dist" "$DEST/fonts" "$DEST/assets"
                cp -r apps/api/dist/. "$DEST/dist/"
                cp -r apps/api/src/lib/og/fonts/. "$DEST/fonts/"
                cp -r apps/api/src/lib/og/assets/. "$DEST/assets/"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/api/dist/server.js
                    test -f /usr/lib/spliit-cloud/api/openapi.json

    - name: spliit-worker
      description: Spliit Cloud background worker
      dependencies:
          runtime:
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Install worker
            runs: |
                DEST="${{targets.destdir}}/usr/lib/spliit-cloud/worker"
                mkdir -p "$DEST"
                cp apps/worker/dist/server.js "$DEST/"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/worker/server.js

    - name: spliit-migrate
      description: Spliit Cloud database migration runner
      dependencies:
          runtime:
              - bash
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Install migrate
            runs: |
                DEST="${{targets.destdir}}/usr/lib/spliit-cloud/migrate"
                mkdir -p "$DEST/node_modules"
                cp -r packages/db/prisma "$DEST/"
                cp -r /tmp/prisma-runtime/node_modules/prisma "$DEST/node_modules/"
                cp -r /tmp/prisma-runtime/node_modules/@prisma "$DEST/node_modules/"
                cat > "$DEST/entrypoint.sh" << 'EOF'
                #!/bin/bash
                set -euo pipefail
                exec bun /usr/lib/spliit-cloud/migrate/node_modules/prisma/build/index.js \
                    migrate deploy \
                    --schema /usr/lib/spliit-cloud/migrate/prisma/schema.prisma
                EOF
                chmod +x "$DEST/entrypoint.sh"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/migrate/prisma/schema.prisma
                    test -f /usr/lib/spliit-cloud/migrate/entrypoint.sh
                    test -f /usr/lib/spliit-cloud/migrate/node_modules/prisma/build/index.js

environment:
    contents:
        repositories:
            - https://packages.wolfi.dev/os
        keyring:
            - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        packages:
            - busybox
            - ca-certificates-bundle
            - bun
    environment:
        # Baked into the web SPA at build time; the API reads
        # PUBLIC_DEFAULT_CURRENCY_CODE at runtime independently.
        VITE_DEFAULT_CURRENCY_CODE: "USD"
        # Mock DATABASE_URL so Prisma can resolve the datasource URL during
        # client generation without hitting an actual database.
        DATABASE_URL: "postgresql://postgres:1234@localhost/spliit"

pipeline:
    - uses: git-checkout
      with:
          repository: https://github.com/antonio-ivanovski/spliit-cloud
          tag: v${{package.version}}
          expected-commit: 2f729fd5fbcc84c2edf051faafcfd024d254c732

    - name: Install dependencies
      runs: |
          bun install --frozen-lockfile

    - name: Generate Prisma client
      runs: |
          bun run --filter @spliit/db prisma-generate

    - name: Build web
      runs: |
          bun run --filter @spliit/web build

    - name: Bundle API
      runs: |
          cd apps/api
          bun run bundle:runtime
          cd ../..

    - name: Bundle worker
      runs: |
          cd apps/worker
          bun run bundle:runtime
          cd ../..

    - name: Install prisma CLI for runtime migrations
      runs: |
          PRISMA_VERSION=$(bun -e "const p=require('./packages/db/package.json');console.log(p.devDependencies.prisma.replace(/^[^0-9]*/,''))")
          mkdir -p /tmp/prisma-runtime
          cd /tmp/prisma-runtime
          bun init -y > /dev/null 2>&1
          bun add "prisma@${PRISMA_VERSION}"

    - name: Install web
      runs: |
          DEST="${{targets.destdir}}/usr/share/spliit"
          mkdir -p "$DEST"
          cp -r apps/web/dist/. "$DEST/"
          mkdir -p "${{targets.destdir}}/etc/caddy"
          cat > "${{targets.destdir}}/etc/caddy/Caddyfile" << 'EOF'
          :80 {
              root * /usr/share/spliit

              @api {
                  path /trpc/*
                  path /auth/*
                  path /.well-known/*
                  path /health
                  path /health/*
                  path /expenses/*/documents/*
                  path /expenses/*/pdf
                  path /groups/*/balance/pdf
                  path /openapi.json
                  path /docs
                  path /docs/*
              }

              reverse_proxy @api api:3001 {
                  header_up X-Real-IP {remote_host}
              }

              @hashedAssets path /assets/*
              header @hashedAssets Cache-Control "public, max-age=31536000, immutable"

              try_files {path} /index.html
              file_server
          }
          EOF

test:
    pipeline:
        - runs: |
              test -f /usr/share/spliit/index.html
              test -f /etc/caddy/Caddyfile
