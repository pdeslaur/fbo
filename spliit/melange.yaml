package:
    name: spliit
    version: "2.10.2"
    epoch: 0
    description: Spliit Cloud web static files and nginx proxy config
    copyright:
        - license: MIT
    dependencies:
        runtime:
            - nginx-mainline

subpackages:
    - name: spliit-api
      description: Spliit Cloud API server
      dependencies:
          runtime:
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Install API
            runs: |
                DEST="${{targets.destdir}}/usr/lib/spliit-cloud/api"
                mkdir -p "$DEST/dist" "$DEST/fonts" "$DEST/assets"
                cp -r apps/api/dist/. "$DEST/dist/"
                cp apps/api/openapi.json "$DEST/"
                cp -r apps/api/src/lib/og/fonts/. "$DEST/fonts/"
                cp -r apps/api/src/lib/og/assets/. "$DEST/assets/"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/api/dist/server.js
                    test -f /usr/lib/spliit-cloud/api/openapi.json

    - name: spliit-worker
      description: Spliit Cloud background worker
      dependencies:
          runtime:
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Install worker
            runs: |
                DEST="${{targets.destdir}}/usr/lib/spliit-cloud/worker"
                mkdir -p "$DEST"
                cp apps/worker/dist/server.js "$DEST/"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/worker/server.js

    - name: spliit-migrate
      description: Spliit Cloud database migration runner
      dependencies:
          runtime:
              - bash
              - bun
              - ca-certificates-bundle
      pipeline:
          - name: Install migrate
            runs: |
                DEST="${{targets.destdir}}/usr/lib/spliit-cloud/migrate"
                mkdir -p "$DEST/node_modules"
                cp -r packages/db/prisma "$DEST/"
                cp -r node_modules/prisma "$DEST/node_modules/"
                cp -r node_modules/@prisma "$DEST/node_modules/"
                cat > "$DEST/entrypoint.sh" << 'EOF'
                #!/bin/bash
                set -euo pipefail
                exec bun /usr/lib/spliit-cloud/migrate/node_modules/prisma/build/index.js \
                    migrate deploy \
                    --schema /usr/lib/spliit-cloud/migrate/prisma/schema.prisma
                EOF
                chmod +x "$DEST/entrypoint.sh"
      test:
          pipeline:
              - runs: |
                    test -f /usr/lib/spliit-cloud/migrate/prisma/schema.prisma
                    test -f /usr/lib/spliit-cloud/migrate/entrypoint.sh
                    test -f /usr/lib/spliit-cloud/migrate/node_modules/prisma/build/index.js

environment:
    contents:
        repositories:
            - https://packages.wolfi.dev/os
        keyring:
            - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        packages:
            - busybox
            - ca-certificates-bundle
            - bun
    environment:
        # Disable Next.js telemetry; also suppresses any Vite telemetry prompts.
        NEXT_TELEMETRY_DISABLED: "1"
        # Baked into the web SPA at build time. Can be overridden by rebuilding
        # the image; the API reads PUBLIC_DEFAULT_CURRENCY_CODE at runtime.
        VITE_DEFAULT_CURRENCY_CODE: "USD"
        # Skip better-auth DB introspection during OpenAPI spec generation so
        # the step does not need a live database.
        SKIP_AUTH_OPENAPI: "1"
        # NODE_ENV is intentionally not set to "production" here so that the
        # API env schema does not enforce BETTER_AUTH_SECRET, SMTP_HOST, etc.
        # during the openapi generation step.
        NODE_ENV: "development"

pipeline:
    - uses: git-checkout
      with:
          repository: https://github.com/antonio-ivanovski/spliit-cloud
          tag: v${{package.version}}
          expected-commit: 2f729fd5fbcc84c2edf051faafcfd024d254c732

    - name: Install dependencies
      runs: |
          bun install --frozen-lockfile

    - name: Generate Prisma client
      runs: |
          bun run --filter @spliit/db prisma generate

    - name: Build web
      runs: |
          bun run --filter @spliit/web build

    - name: Generate OpenAPI spec
      runs: |
          cd apps/api
          bun run generate-openapi
          cd ../..

    - name: Bundle API
      runs: |
          cd apps/api
          bun run bundle:runtime
          cd ../..

    - name: Bundle worker
      runs: |
          cd apps/worker
          bun run bundle:runtime
          cd ../..

    - name: Install web
      runs: |
          DEST="${{targets.destdir}}/usr/share/nginx/html"
          mkdir -p "$DEST"
          cp -r apps/web/dist/. "$DEST/"
          mkdir -p "${{targets.destdir}}/etc/nginx/conf.d"
          cp nginx.web.conf "${{targets.destdir}}/etc/nginx/conf.d/default.conf"

test:
    pipeline:
        - runs: |
              test -f /usr/share/nginx/html/index.html
              test -f /etc/nginx/conf.d/default.conf
